# The checks a PR must pass, called by ci.yml.
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json pins node 20.x with engine-strict, like the Dockerfile.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      # npm ci installs exactly what package-lock.json pins, like the Dockerfile.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
